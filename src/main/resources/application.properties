spring.application.name=recruitment-platform

spring.datasource.url=jdbc:postgresql://localhost:5432/recruitment_db
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

spring.ldap.base=dc=recruitment,dc=com
spring.ldap.embedded.base-dn=${spring.ldap.base}
spring.ldap.embedded.port=8389
spring.ldap.embedded.ldif=classpath:users